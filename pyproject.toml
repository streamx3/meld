[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meldq"
dynamic = ["version"]
description = "Visual diff and merge tool (PyQt6 port of Meld)"
license = "GPL-2.0-or-later"
requires-python = ">=3.11"
# QScintilla is a hard runtime dependency: meldq.widgets.sciview imports
# PyQt6.Qsci at module load, and every view builds on MeldSciView.
dependencies = ["PyQt6>=6.6", "PyQt6-QScintilla>=2.14"]

[project.optional-dependencies]
highlight = ["pygments"]
dev = ["pytest", "pytest-qt", "pytest-timeout"]
package = ["pyinstaller>=6.0"]

[project.scripts]
meldq = "meldq.main:main"

[tool.setuptools.dynamic]
version = { attr = "meldq.__version__" }

[tool.setuptools.packages.find]
include = ["meldq*"]

[tool.setuptools.package-data]
meldq = ["resources/**/*", "ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
