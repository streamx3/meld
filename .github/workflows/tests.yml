name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Qt's offscreen platform still needs the client-side GL/xkb libraries.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3

      - name: Install meldq + dev deps
        run: pip install -e ".[dev]"

      - name: Run test suite (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q --timeout=120 -p no:cacheprovider
